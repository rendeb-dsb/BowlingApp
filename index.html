<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16324f">
  <meta name="description" content="Bowling PWA starter interface">
  <title>Bowling</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/bowling.svg" type="image/svg+xml">
  <style>
    :root { --navy:#16324f; --blue:#2e6f95; --cream:#fffaf0; --ink:#1d2935; --line:#cbd5df; --menu:#f2f6fa; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:#eef3f7; }
    body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
    .topbar { min-height:48px; display:grid; grid-template-columns:72px 1fr 44px; align-items:center; gap:6px; padding:4px 10px; background:var(--navy); color:white; }
    .version { font-size:12px; white-space:nowrap; justify-self:start; }
    h1 { font-size:20px; line-height:1.2; font-weight:700; text-align:center; margin:0; }
    .gear { width:20px; height:20px; justify-self:end; display:grid; place-items:center; border:0; background:transparent; color:white; padding:0; cursor:pointer; }
    .gear svg { width:20px; height:20px; display:block; }
    .menu-bar { background:var(--menu); border-bottom:1px solid var(--line); padding:0 10px; min-height:42px; display:flex; align-items:center; gap:4px; position:relative; z-index:5; }
    .menu-wrap { position:relative; }
    .menu-button { border:1px solid transparent; border-radius:5px; background:transparent; color:#172a3a; padding:8px 12px; font-size:15px; cursor:pointer; }
    .menu-button[aria-expanded="true"], .menu-button:hover { background:#dce8f1; border-color:#b7cad9; }
    .dropdown { display:none; position:absolute; top:calc(100% + 1px); left:0; min-width:170px; background:white; border:1px solid #b9c8d5; border-radius:5px; box-shadow:0 5px 15px #15283b2b; padding:4px; }
    .dropdown.open { display:block; }
    .dropdown button { width:100%; text-align:left; border:0; border-radius:3px; padding:9px 10px; background:white; color:#172a3a; font-size:14px; cursor:pointer; }
    .dropdown button:hover { background:#eaf2f8; }
    .dropdown hr { border:0; border-top:1px solid #d7e0e7; margin:4px 2px; }
    main { flex:1; min-height:0; display:flex; justify-content:center; align-items:center; padding:12px; overflow:auto; }
    .home-panel { width:100%; min-height:100%; display:flex; align-items:center; justify-content:center; }
    .home-art { width:90%; height:75%; max-height:75%; object-fit:contain; display:block; }
    .settings-panel { display:none; width:min(680px, 94%); background:white; border:1px solid var(--line); border-radius:12px; padding:24px; box-shadow:0 4px 18px #16324f12; }
    .settings-panel h2 { margin:0 0 12px; color:var(--navy); font-size:22px; }
    .settings-panel p { margin:8px 0; line-height:1.5; }
    .status-note { margin-top:18px; padding:12px; border-left:4px solid var(--blue); background:#eef6fb; border-radius:4px; }
    .footer { font-size:11px; color:#526577; text-align:center; padding:5px 8px max(5px, env(safe-area-inset-bottom)); }
    @media (max-width:480px) {
      .topbar { grid-template-columns:58px 1fr 28px; padding-left:7px; padding-right:7px; }
      h1 { font-size:19px; }
      .version { font-size:11px; }
      .menu-bar { padding:0 6px; }
      .menu-button { padding:8px 10px; }
      main { padding:8px; }
      .settings-panel { padding:18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="version">b1v1</div>
    <h1>Bowling</h1>
    <button class="gear" id="settingsButton" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.55-2-3.46-2.36.95a7.6 7.6 0 0 0-1.73-1L15 3.4h-4l-.36 2.54a7.6 7.6 0 0 0-1.73 1l-2.36-.95-2 3.46 2 1.55a7.8 7.8 0 0 0 0 2l-2 1.55 2 3.46 2.36-.95a7.6 7.6 0 0 0 1.73 1L11 20.6h4l.36-2.54a7.6 7.6 0 0 0 1.73-1l2.36.95 2-3.46zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 -0.0) scale(.96)"/>
      </svg>
    </button>
  </header>

  <nav class="menu-bar" aria-label="Main menu">
    <div class="menu-wrap">
      <button class="menu-button" id="actionsButton" aria-expanded="false" aria-haspopup="true">Actions ▾</button>
      <div class="dropdown" id="actionsMenu" role="menu">
        <button role="menuitem" data-action="Add">Add</button>
        <button role="menuitem" data-action="Change">Change</button>
        <button role="menuitem" data-action="Delete">Delete</button>
        <hr>
        <button role="menuitem" data-action="Import">Import</button>
        <button role="menuitem" data-action="Export">Export</button>
        <hr>
        <button role="menuitem" data-action="Quit">Quit</button>
      </div>
    </div>
  </nav>

  <main id="displayArea">
    <section class="home-panel" id="homePanel" aria-label="Bowling home screen">
      <svg class="home-art" viewBox="0 0 900 620" role="img" aria-label="Cute bowling pins and a bowling ball" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#e5f4ff"/>
          </linearGradient>
          <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#64c6e8"/><stop offset="1" stop-color="#2872b8"/>
          </linearGradient>
          <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#183650" flood-opacity=".17"/>
          </filter>
        </defs>
        <rect x="15" y="15" width="870" height="590" rx="44" fill="url(#bg)" stroke="#d1e5f2" stroke-width="3"/>
        <circle cx="105" cy="100" r="10" fill="#f6ca63"/><circle cx="790" cy="115" r="14" fill="#f6ca63"/>
        <path d="M65 475 Q450 420 835 475 L835 535 Q450 575 65 535Z" fill="#d5e7f0"/>
        <path d="M90 495 Q450 455 810 495" fill="none" stroke="#b2d1e1" stroke-width="4" stroke-linecap="round"/>
        <!-- Left pin -->
        <g filter="url(#shadow)" transform="translate(245 190) rotate(-8)">
          <path d="M-29 0 C-34 -28 -14 -48 -14 -71 C-14 -91 14 -91 14 -71 C14 -48 34 -28 29 0 L42 98 Q42 128 0 133 Q-42 128 -42 98Z" fill="#fff" stroke="#d9e2e8" stroke-width="4"/>
          <path d="M-29 -6 Q0 5 29 -6 L34 10 Q0 24 -34 10Z" fill="#ef5361"/>
          <path d="M-27 9 Q0 20 31 9 L35 24 Q0 37 -31 24Z" fill="#ef5361"/>
          <circle cx="-10" cy="53" r="4" fill="#3c5264"/><circle cx="10" cy="53" r="4" fill="#3c5264"/>
          <path d="M-10 67 Q0 77 10 67" fill="none" stroke="#3c5264" stroke-width="3" stroke-linecap="round"/>
        </g>
        <!-- Center pin -->
        <g filter="url(#shadow)" transform="translate(450 155)">
          <path d="M-31 0 C-37 -30 -15 -50 -15 -74 C-15 -95 15 -95 15 -74 C15 -50 37 -30 31 0 L45 112 Q45 145 0 150 Q-45 145 -45 112Z" fill="#fff" stroke="#d9e2e8" stroke-width="4"/>
          <path d="M-32 -8 Q0 5 32 -8 L37 9 Q0 24 -37 9Z" fill="#ef5361"/>
          <path d="M-30 10 Q0 23 34 10 L38 27 Q0 41 -34 27Z" fill="#ef5361"/>
          <circle cx="-11" cy="60" r="4.5" fill="#3c5264"/><circle cx="11" cy="60" r="4.5" fill="#3c5264"/>
          <path d="M-11 75 Q0 86 11 75" fill="none" stroke="#3c5264" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <!-- Right pin -->
        <g filter="url(#shadow)" transform="translate(650 195) rotate(8)">
          <path d="M-29 0 C-34 -28 -14 -48 -14 -71 C-14 -91 14 -91 14 -71 C14 -48 34 -28 29 0 L42 98 Q42 128 0 133 Q-42 128 -42 98Z" fill="#fff" stroke="#d9e2e8" stroke-width="4"/>
          <path d="M-29 -6 Q0 5 29 -6 L34 10 Q0 24 -34 10Z" fill="#ef5361"/>
          <path d="M-27 9 Q0 20 31 9 L35 24 Q0 37 -31 24Z" fill="#ef5361"/>
          <circle cx="-10" cy="53" r="4" fill="#3c5264"/><circle cx="10" cy="53" r="4" fill="#3c5264"/>
          <path d="M-10 67 Q0 77 10 67" fill="none" stroke="#3c5264" stroke-width="3" stroke-linecap="round"/>
        </g>
        <!-- Ball -->
        <g filter="url(#shadow)">
          <circle cx="450" cy="430" r="92" fill="url(#ball)" stroke="#205f98" stroke-width="4"/>
          <ellipse cx="420" cy="395" rx="32" ry="18" fill="#ffffff" opacity=".18" transform="rotate(-35 420 395)"/>
          <circle cx="428" cy="407" r="9" fill="#164d7b"/><circle cx="457" cy="397" r="9" fill="#164d7b"/><circle cx="449" cy="430" r="9" fill="#164d7b"/>
        </g>
        <path d="M160 170 l8 18 19 2 -14 13 4 19 -17 -10 -17 10 4 -19 -14 -13 19 -2Z" fill="#f6ca63"/>
        <path d="M725 300 l6 14 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2Z" fill="#8ecfba"/>
        <text x="450" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#16324f">Let's go bowling!</text>
      </svg>
    </section>
    <section class="settings-panel" id="settingsPanel" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>
      <p>This is the initial Settings display for the Bowling app.</p>
      <div class="status-note">Settings options will be implemented in a later version.</div>
      <p><strong>Application version:</strong> b1v1</p>
      <button class="menu-button" id="homeButton" style="border:1px solid #b7cad9;margin-top:10px;">Return to Home</button>
    </section>
  </main>
  <div class="footer">Bowling · Initial visual prototype · b1v1</div>

  <script>
    const actionsButton = document.getElementById('actionsButton');
    const actionsMenu = document.getElementById('actionsMenu');
    const settingsButton = document.getElementById('settingsButton');
    const homePanel = document.getElementById('homePanel');
    const settingsPanel = document.getElementById('settingsPanel');

    function closeMenu() {
      actionsMenu.classList.remove('open');
      actionsButton.setAttribute('aria-expanded', 'false');
    }
    function showHome() {
      settingsPanel.style.display = 'none';
      homePanel.style.display = 'flex';
      closeMenu();
    }
    function showSettings() {
      homePanel.style.display = 'none';
      settingsPanel.style.display = 'block';
      closeMenu();
    }
    actionsButton.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = actionsMenu.classList.toggle('open');
      actionsButton.setAttribute('aria-expanded', String(open));
    });
    settingsButton.addEventListener('click', showSettings);
    document.getElementById('homeButton').addEventListener('click', showHome);
    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        closeMenu();
        if (action === 'Quit') {
          alert('To close Bowling, use your device’s app switcher or browser controls.');
        } else if (action === 'Import' || action === 'Export') {
          alert(action + ' will be implemented when the BowlingDB database is added.');
        } else {
          alert(action + ' will be implemented in a later version.');
        }
      });
    });
    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) closeMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeMenu();
    });
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
