<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16324f">
  <meta name="description" content="Bowling PWA starter interface">
  <title>Bowling</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/bowling.svg" type="image/svg+xml">
  <style>
    :root { --navy:#16324f; --blue:#2e6f95; --cream:#fffaf0; --ink:#1d2935; --line:#cbd5df; --menu:#f2f6fa; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:#eef3f7; }
    body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
    .topbar { min-height:48px; display:grid; grid-template-columns:72px 1fr 44px; align-items:center; gap:6px; padding:4px 10px; background:var(--navy); color:white; }
    .version { font-size:12px; white-space:nowrap; justify-self:start; }
    h1 { font-size:20px; line-height:1.2; font-weight:700; text-align:center; margin:0; }
    .gear { width:20px; height:20px; justify-self:end; display:grid; place-items:center; border:0; background:transparent; color:white; padding:0; cursor:pointer; }
    .gear svg { width:20px; height:20px; display:block; }
    .menu-bar { background:var(--menu); border-bottom:1px solid var(--line); padding:0 10px; min-height:42px; display:flex; align-items:center; gap:4px; position:relative; z-index:5; }
    .menu-wrap { position:relative; }
    .menu-button { border:1px solid transparent; border-radius:5px; background:transparent; color:#172a3a; padding:8px 12px; font-size:15px; cursor:pointer; }
    .menu-button[aria-expanded="true"], .menu-button:hover { background:#dce8f1; border-color:#b7cad9; }
    .dropdown { display:none; position:absolute; top:calc(100% + 1px); left:0; min-width:170px; background:white; border:1px solid #b9c8d5; border-radius:5px; box-shadow:0 5px 15px #15283b2b; padding:4px; }
    .dropdown.open { display:block; }
    .dropdown button { width:100%; text-align:left; border:0; border-radius:3px; padding:9px 10px; background:white; color:#172a3a; font-size:14px; cursor:pointer; }
    .dropdown button:hover { background:#eaf2f8; }
    .dropdown hr { border:0; border-top:1px solid #d7e0e7; margin:4px 2px; }
    main { flex:1; min-height:0; display:flex; justify-content:center; align-items:stretch; padding:12px; overflow:auto; }
    .home-panel { flex:1; width:100%; height:100%; min-height:0; min-width:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    /* Fit the complete startup graphic into the actual space above the footer.
       Keep the source aspect ratio and let the available width or height govern scaling. */
    .home-art { display:block; width:auto; height:auto; max-width:100%; max-height:100%; object-fit:contain; flex:0 1 auto; }
    .settings-panel { display:none; width:min(680px, 94%); background:white; border:1px solid var(--line); border-radius:12px; padding:24px; box-shadow:0 4px 18px #16324f12; }
    .settings-panel h2 { margin:0 0 12px; color:var(--navy); font-size:22px; }
    .settings-panel p { margin:8px 0; line-height:1.5; }
    .status-note { margin-top:18px; padding:12px; border-left:4px solid var(--blue); background:#eef6fb; border-radius:4px; }
    .footer { font-size:11px; color:#526577; text-align:center; padding:5px 8px max(5px, env(safe-area-inset-bottom)); }

    .menu-button.active { background:#c9dce9; border-color:#8eafc5; font-weight:700; }
    #lanesButton { margin-left:0; }
    .display-screen { display:none; width:100%; align-self:stretch; }
    #displayArea { align-items:stretch; justify-content:flex-start; }
    .lanes-empty { width:100%; text-align:center; padding:28px 12px; color:#33495b; }
    .screen-titlebar { width:100%; display:flex; align-items:center; gap:12px; padding:2px 0 14px; border-bottom:1px solid var(--line); margin-bottom:14px; }
    .screen-titlebar h2 { font-size:22px; font-weight:700; margin:0; color:var(--navy); }
    .title-actions { margin-left:auto; display:flex; gap:8px; }
    .action-button { border:1px solid #aebfcd; border-radius:5px; padding:7px 15px; font-size:14px; background:#f7fafc; color:#1d3447; cursor:pointer; }
    .action-button.primary { background:var(--navy); color:white; border-color:var(--navy); }
    .lane-form { width:100%; margin:0; }
    .lane-fields { width:100%; border-collapse:collapse; table-layout:fixed; }
    .lane-fields td { border:0; padding:6px 0; vertical-align:middle; }
    .lane-fields .label-cell { width:118px; padding-right:8px; text-align:right; white-space:nowrap; font-size:15px; }
    .lane-fields .control-cell { padding-left:8px; min-width:0; }
    .control-group { display:flex; align-items:center; flex-wrap:wrap; gap:8px 18px; min-width:0; }
    .inline-field { display:inline-flex; align-items:center; gap:6px; min-width:0; }
    .inline-field label { white-space:nowrap; font-size:15px; }
    .lane-fields input { height:34px; border:1px solid #9eafbd; border-radius:4px; padding:5px 8px; font:16px Arial,Helvetica,sans-serif; background:white; color:var(--ink); min-width:0; }
    .lane-fields input:focus { outline:2px solid #8cbde0; outline-offset:1px; }
    #laneName, #laneAddress1, #laneAddress2 { width:min(520px, 100%); max-width:100%; }
    #laneTelephone { width:148px; font-variant-numeric:tabular-nums; }
    #laneOrder { width:42px; padding-left:3px; padding-right:3px; }
    #laneCity { width:min(250px, 100%); max-width:100%; }
    #laneState { width:42px; padding-left:4px; padding-right:2px; text-transform:uppercase; }
    #laneZip { width:82px; }
    .lane-list-wrap { width:100%; overflow:auto; }
    .lane-list { border-collapse:collapse; width:100%; min-width:680px; background:white; }
    .lane-list th, .lane-list td { padding:8px 7px; border:1px solid #cbd5df; text-align:left; font-size:13px; }
    .lane-list th { background:#e7eef4; font-weight:700; }
    .lane-list th:first-child, .lane-list td:first-child { width:34px; text-align:center; }
    .lane-list input[type=radio] { margin:0; }
    @media (max-width:480px) {
      .screen-titlebar h2 { font-size:20px; }
      .screen-titlebar { gap:6px; }
      .title-actions { gap:5px; }
      .action-button { padding:7px 10px; }
      .lane-fields .label-cell { width:112px; font-size:14px; padding-right:6px; }
      .lane-fields .control-cell { padding-left:6px; }
      .inline-field label { font-size:14px; }
      .control-group { gap:8px 10px; }
    }

    @media (max-width:480px) {
      .topbar { grid-template-columns:58px 1fr 28px; padding-left:7px; padding-right:7px; }
      h1 { font-size:19px; }
      .version { font-size:11px; }
      .menu-bar { padding:0 6px; }
      .menu-button { padding:8px 10px; }
      main { padding:8px; }
      .settings-panel { padding:18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="version">b1v11</div>
    <h1>Bowling</h1>
    <button class="gear" id="settingsButton" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.55-2-3.46-2.36.95a7.6 7.6 0 0 0-1.73-1L15 3.4h-4l-.36 2.54a7.6 7.6 0 0 0-1.73 1l-2.36-.95-2 3.46 2 1.55a7.8 7.8 0 0 0 0 2l-2 1.55 2 3.46 2.36-.95a7.6 7.6 0 0 0 1.73 1L11 20.6h4l.36-2.54a7.6 7.6 0 0 0 1.73-1l2.36.95 2-3.46zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 -0.0) scale(.96)"/>
      </svg>
    </button>
  </header>

  <nav class="menu-bar" aria-label="Main menu">
    <div class="menu-wrap">
      <button class="menu-button" id="actionsButton" aria-expanded="false" aria-haspopup="true">Actions ▾</button>
      <div class="dropdown" id="actionsMenu" role="menu">
        <button role="menuitem" data-action="Add">Add</button>
        <button role="menuitem" data-action="Change">Change</button>
        <button role="menuitem" data-action="Delete">Delete</button>
        <hr>
        <button role="menuitem" data-action="Import">Import</button>
        <button role="menuitem" data-action="Export">Export</button>
        <hr>
        <button role="menuitem" data-action="Quit">Quit</button>
      </div>
    </div>
    <button class="menu-button" id="lanesButton" aria-pressed="false">Lanes</button>
  </nav>

  <main id="displayArea">
    <section class="home-panel" id="homePanel" aria-label="Bowling home screen">
      <img class="home-art" src="./images/bowling-home.png" alt="Colorful bowling alley with a smiling blue bowling ball and bowling pins">
    </section>
    <section class="settings-panel" id="settingsPanel" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>
      <p>This is the initial Settings display for the Bowling app.</p>
      <div class="status-note">Settings options will be implemented in a later version.</div>
      <p><strong>Application version:</strong> b1v11</p>
      <button class="menu-button" id="homeButton" style="border:1px solid #b7cad9;margin-top:10px;">Return to Home</button>
    </section>
    <section class="display-screen" id="lanesListScreen" aria-label="Lanes list">
      <div class="lanes-empty">No records to display.</div>
    </section>
    <section class="display-screen" id="addLaneScreen" aria-label="Add Lanes Management">
      <div class="screen-titlebar">
        <h2>Add Lanes Management</h2>
        <div class="title-actions">
          <button class="action-button primary" id="saveLaneButton" type="button">Save</button>
          <button class="action-button" id="cancelLaneButton" type="button">Cancel</button>
        </div>
      </div>
      <form class="lane-form" id="laneForm" autocomplete="off">
      <table class="lane-fields" aria-label="Lane details">
        <tbody>
          <tr>
            <td class="label-cell"><label for="laneName">Name:</label></td>
            <td class="control-cell"><input id="laneName" name="Name" type="text"></td>
          </tr>
          <tr>
            <td class="label-cell"><label for="laneTelephone">Telephone:</label></td>
            <td class="control-cell">
              <div class="control-group">
                <input id="laneTelephone" name="Telephone" type="text" inputmode="numeric" placeholder="(___) ___-____" maxlength="14" aria-label="Telephone number">
                <span class="inline-field"><label for="laneOrder">Order:</label><input id="laneOrder" name="Order" type="text" inputmode="numeric" maxlength="6" aria-label="Order"></span>
              </div>
            </td>
          </tr>
          <tr>
            <td class="label-cell"><label for="laneAddress1">Address 1:</label></td>
            <td class="control-cell"><input id="laneAddress1" name="Address1" type="text"></td>
          </tr>
          <tr>
            <td class="label-cell"><label for="laneAddress2">Address 2:</label></td>
            <td class="control-cell"><input id="laneAddress2" name="Address2" type="text"></td>
          </tr>
          <tr>
            <td class="label-cell"><label for="laneCity">City:</label></td>
            <td class="control-cell"><input id="laneCity" name="City" type="text"></td>
          </tr>
          <tr>
            <td class="label-cell"><label for="laneState">State:</label></td>
            <td class="control-cell">
              <div class="control-group">
                <input id="laneState" name="State" type="text" value="FL" maxlength="2" inputmode="text">
                <span class="inline-field"><label for="laneZip">Zip:</label><input id="laneZip" name="Zip" type="text" inputmode="numeric" maxlength="5"></span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      </form>
    </section>
  </main>
  <div class="footer">Bowling · Initial visual prototype · b1v11</div>

  <script>
    const actionsButton = document.getElementById('actionsButton');
    const actionsMenu = document.getElementById('actionsMenu');
    const settingsButton = document.getElementById('settingsButton');
    const homePanel = document.getElementById('homePanel');
    const settingsPanel = document.getElementById('settingsPanel');
    const lanesButton = document.getElementById('lanesButton');
    const lanesListScreen = document.getElementById('lanesListScreen');
    const addLaneScreen = document.getElementById('addLaneScreen');

    function closeMenu() {
      actionsMenu.classList.remove('open');
      actionsButton.setAttribute('aria-expanded', 'false');
    }
    function hideScreens() {
      homePanel.style.display = 'none';
      settingsPanel.style.display = 'none';
      lanesListScreen.style.display = 'none';
      addLaneScreen.style.display = 'none';
    }
    function setLanesActive(active) {
      lanesButton.classList.toggle('active', active);
      lanesButton.setAttribute('aria-pressed', String(active));
    }
    function showHome() {
      hideScreens();
      homePanel.style.display = 'flex';
      setLanesActive(false);
      closeMenu();
    }
    function showSettings() {
      hideScreens();
      settingsPanel.style.display = 'block';
      setLanesActive(false);
      closeMenu();
    }
    function showLanesList() {
      hideScreens();
      lanesListScreen.style.display = 'block';
      setLanesActive(true);
      closeMenu();
    }
    function showAddLane() {
      hideScreens();
      addLaneScreen.style.display = 'block';
      setLanesActive(true);
      closeMenu();
      document.getElementById('laneForm').reset();
      document.getElementById('laneState').value = 'FL';
      document.getElementById('laneTelephone').value = '';
    }
    actionsButton.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = actionsMenu.classList.toggle('open');
      actionsButton.setAttribute('aria-expanded', String(open));
    });
    settingsButton.addEventListener('click', showSettings);
    document.getElementById('homeButton').addEventListener('click', showHome);
    lanesButton.addEventListener('click', showLanesList);
    document.getElementById('cancelLaneButton').addEventListener('click', showLanesList);

    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        closeMenu();
        if (action === 'Add') {
          showAddLane();
        } else if (action === 'Quit') {
          alert('To close Bowling, use your device’s app switcher or browser controls.');
        } else if (action === 'Import' || action === 'Export') {
          alert(action + ' will be implemented when the BowlingDB database is added.');
        } else {
          alert(action + ' will be implemented in a later version.');
        }
      });
    });

    // Save is intentionally visual-only until BowlingDB is implemented.
    document.getElementById('saveLaneButton').addEventListener('click', (event) => {
      event.preventDefault();
    });
    document.getElementById('laneForm').addEventListener('submit', event => event.preventDefault());

    // Telephone mask: punctuation is fixed and each underscore is an editable digit slot.
    // Intercept edits before the browser can replace or shift the mask characters.
    const telephone = document.getElementById('laneTelephone');
    const PHONE_MASK = '(___) ___-____';
    const PHONE_SLOTS = [1, 2, 3, 6, 7, 8, 10, 11, 12, 13];
    const phoneDigits = () => telephone.value.replace(/\D/g, '').slice(0, 10);
    function phoneMask(digits) {
      const chars = PHONE_MASK.split('');
      PHONE_SLOTS.forEach((position, i) => { chars[position] = digits[i] || '_'; });
      return chars.join('');
    }
    function nextPhoneSlot(position) {
      return PHONE_SLOTS.find(slot => slot >= position) ?? PHONE_MASK.length;
    }
    function applyPhoneEdit(kind, text = '') {
      let chars = (telephone.value || PHONE_MASK).split('');
      if (chars.length !== PHONE_MASK.length) chars = PHONE_MASK.split('');
      const start = telephone.selectionStart ?? 0;
      const end = telephone.selectionEnd ?? start;
      let selectedSlots = PHONE_SLOTS.filter(slot => slot >= start && slot < end);
      let caret;
      if (kind === 'insert') {
        const digits = text.replace(/\D/g, '');
        if (!digits) return;
        let slotIndex = selectedSlots.length ? PHONE_SLOTS.indexOf(selectedSlots[0]) : PHONE_SLOTS.findIndex(slot => slot >= start);
        if (slotIndex < 0) slotIndex = PHONE_SLOTS.length;
        // Typing over a selection starts at its first editable position.
        for (let i = 0; i < digits.length && slotIndex + i < PHONE_SLOTS.length; i++) {
          chars[PHONE_SLOTS[slotIndex + i]] = digits[i];
        }
        caret = PHONE_SLOTS[Math.min(slotIndex + digits.length, PHONE_SLOTS.length - 1)] ?? PHONE_MASK.length;
        if (slotIndex + digits.length >= PHONE_SLOTS.length) caret = PHONE_MASK.length;
      } else {
        let slotsToClear = selectedSlots;
        if (!slotsToClear.length) {
          // Backspace removes the editable digit immediately before the caret.
          // Use a strict less-than comparison so repeated Backspace continues
          // moving left after each deletion instead of stopping at the same slot.
          let slot;
          if (kind === 'backward') {
            const precedingSlots = PHONE_SLOTS.filter(position => position < start);
            slot = precedingSlots.length ? precedingSlots[precedingSlots.length - 1] : null;
          } else {
            slot = PHONE_SLOTS.find(position => position >= start) ?? null;
          }
          if (slot !== null) slotsToClear = [slot];
        }
        if (!slotsToClear.length) return;
        slotsToClear.forEach(slot => { chars[slot] = '_'; });
        caret = slotsToClear[0];
      }
      telephone.value = chars.join('');
      telephone.setSelectionRange(caret, caret);
    }
    telephone.addEventListener('focus', () => {
      if (!telephone.value) telephone.value = PHONE_MASK;
      const firstBlank = telephone.value.indexOf('_');
      const position = firstBlank < 0 ? PHONE_MASK.length : firstBlank;
      telephone.setSelectionRange(position, position);
    });
    telephone.addEventListener('keydown', event => {
      if (/^\d$/.test(event.key)) {
        event.preventDefault();
        applyPhoneEdit('insert', event.key);
      } else if (event.key === 'Backspace' || event.key === 'Delete') {
        event.preventDefault();
        applyPhoneEdit(event.key === 'Backspace' ? 'backward' : 'forward');
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight' || event.key === 'Tab' || event.key === 'Home' || event.key === 'End') {
        // Allow ordinary navigation; edits remain restricted to digit slots.
      } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
      }
    });
    telephone.addEventListener('beforeinput', event => {
      if (event.inputType === 'insertText' || event.inputType === 'insertCompositionText') {
        event.preventDefault();
        applyPhoneEdit('insert', event.data || '');
      } else if (event.inputType === 'deleteContentBackward' || event.inputType === 'deleteContentForward') {
        event.preventDefault();
        applyPhoneEdit(event.inputType === 'deleteContentBackward' ? 'backward' : 'forward');
      } else if (event.inputType === 'insertFromPaste') {
        event.preventDefault();
        applyPhoneEdit('insert', event.data || '');
      }
    });
    telephone.addEventListener('paste', event => {
      event.preventDefault();
      applyPhoneEdit('insert', event.clipboardData?.getData('text') || '');
    });
    telephone.addEventListener('blur', () => {
      if (phoneDigits().length === 0) telephone.value = '';
      else telephone.value = phoneMask(phoneDigits());
    });
    const stateInput = document.getElementById('laneState');
    stateInput.addEventListener('input', () => {
      stateInput.value = stateInput.value.replace(/[^a-z]/gi, '').toUpperCase().slice(0, 2);
    });
    document.getElementById('laneOrder').addEventListener('input', event => {
      event.target.value = event.target.value.replace(/\D/g, '');
    });
    document.getElementById('laneZip').addEventListener('input', event => {
      event.target.value = event.target.value.replace(/\D/g, '').slice(0, 5);
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) closeMenu();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeMenu();
    });
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</body>
</html>
